<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="420" fill="#f5f1ea"/>

  <!-- Entwurf 1: Schriftzug -->
  <g transform="translate(160,170)">
    <text x="0" y="0" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="14" fill="#1f1f1f">AURA</text>
    <line x1="-70" y1="28" x2="-30" y2="28" stroke="#1f1f1f" stroke-width="1.5"/>
    <text x="0" y="33" text-anchor="middle" font-size="15" letter-spacing="4" fill="#1f1f1f">duft</text>
    <line x1="30" y1="28" x2="70" y2="28" stroke="#1f1f1f" stroke-width="1.5"/>
    <text x="0" y="150" text-anchor="middle" font-size="16" fill="#6b6255">1 · Schriftzug</text>
  </g>

  <!-- Entwurf 2: Heiligenschein / Aura-Ring -->
  <g transform="translate(480,150)">
    <circle cx="0" cy="0" r="62" fill="none" stroke="#b8894a" stroke-width="3"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#b8894a" stroke-width="1" opacity="0.5"/>
    <text x="0" y="16" text-anchor="middle" font-size="44" font-weight="700" letter-spacing="6" fill="#1f1f1f">AURA</text>
    <text x="0" y="110" text-anchor="middle" font-size="15" letter-spacing="4" fill="#1f1f1f">autoduft</text>
    <text x="0" y="170" text-anchor="middle" font-size="16" fill="#6b6255">2 · Aura-Ring (Symbol)</text>
  </g>

  <!-- Entwurf 3: Holzanhänger-Mockup -->
  <g transform="translate(800,60)">
    <rect x="-18" y="0" width="36" height="22" rx="6" fill="#2b2b2b"/>
    <rect x="-70" y="22" width="140" height="190" rx="22" fill="#c99a63"/>
    <path d="M-70 70 Q0 60 70 75 M-70 120 Q0 110 70 128 M-70 170 Q0 160 70 176" stroke="#b07f4a" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="0" cy="105" r="40" fill="none" stroke="#4a3320" stroke-width="2"/>
    <text x="0" y="116" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="3" fill="#4a3320">AURA</text>
    <text x="0" y="185" text-anchor="middle" font-size="11" letter-spacing="3" fill="#4a3320">OSTSEE</text>
    <text x="0" y="260" text-anchor="middle" font-size="16" fill="#6b6255">3 · So auf Holz graviert</text>
  </g>
</svg>
