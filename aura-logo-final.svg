<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Bildmarke: A mit Duft-Welle als Querstrich, umgeben von einem Aura-Ring -->
    <g id="mark">
      <circle cx="0" cy="0" r="58" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="68" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35"/>
      <path d="M-26 32 L0 -34 L26 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-20 10 Q-10 2 0 10 T20 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="760" fill="#f4f2ee"/>

  <!-- 1) Hauptlogo hell: AURA autoduft -->
  <g transform="translate(300,190)" color="#1c1c1c">
    <use href="#mark" transform="translate(-150,0)"/>
    <text x="-58" y="20" font-size="74" font-weight="700" letter-spacing="14" fill="#1c1c1c">AURA</text>
    <text x="-55" y="58" font-size="17" letter-spacing="9" fill="#8a6a3f">AUTODUFT</text>
    <text x="-150" y="140" font-size="14" fill="#7a746b">1 · Hauptlogo (hell)</text>
  </g>

  <!-- 2) Hauptlogo dunkel -->
  <g transform="translate(600,40)">
    <rect x="0" y="0" width="560" height="300" rx="20" fill="#161616"/>
    <g transform="translate(150,140)" color="#f4f2ee">
      <use href="#mark"/>
    </g>
    <text x="240" y="160" font-size="66" font-weight="700" letter-spacing="12" fill="#f4f2ee">AURA</text>
    <text x="243" y="196" font-size="15" letter-spacing="8" fill="#c9a96b">AUTODUFT</text>
    <text x="0" y="330" font-size="14" fill="#7a746b">2 · Dunkel (Instagram, Verpackung)</text>
  </g>

  <!-- 3) Paris-Variante -->
  <g transform="translate(40,420)">
    <rect x="0" y="0" width="420" height="280" rx="20" fill="#ffffff" stroke="#e3ddd2"/>
    <g transform="translate(210,95)" color="#1c1c1c"><use href="#mark" transform="scale(0.8)"/></g>
    <text x="210" y="205" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="12" fill="#1c1c1c">AURA</text>
    <line x1="140" y1="232" x2="175" y2="232" stroke="#b8925a" stroke-width="1.2"/>
    <text x="210" y="237" text-anchor="middle" font-family="Didot, 'Bodoni 72', Georgia, serif" font-style="italic" font-size="17" letter-spacing="4" fill="#b8925a">Paris</text>
    <line x1="245" y1="232" x2="280" y2="232" stroke="#b8925a" stroke-width="1.2"/>
    <text x="0" y="305" font-size="14" fill="#7a746b">3 · Premium-Variante „Paris“</text>
  </g>

  <!-- 4) Nur Bildmarke (App-Icon / Profilbild) -->
  <g transform="translate(520,430)">
    <rect x="0" y="0" width="240" height="240" rx="52" fill="#c9a96b"/>
    <g transform="translate(120,120)" color="#161616"><use href="#mark" transform="scale(1.25)"/></g>
    <text x="0" y="275" font-size="14" fill="#7a746b">4 · Icon / Profilbild</text>
  </g>

  <!-- 5) Auf dem Holzanhänger -->
  <g transform="translate(980,400)">
    <rect x="-20" y="0" width="40" height="24" rx="7" fill="#2b2b2b"/>
    <rect x="-85" y="24" width="170" height="250" rx="28" fill="#c99a63"/>
    <path d="M-85 80 Q0 68 85 86 M-85 140 Q0 128 85 148 M-85 205 Q0 193 85 212" stroke="#b07f4a" stroke-width="2" fill="none" opacity="0.55"/>
    <g transform="translate(0,110)" color="#4a3320"><use href="#mark" transform="scale(0.62)"/></g>
    <text x="0" y="192" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="7" fill="#4a3320">AURA</text>
    <text x="0" y="240" text-anchor="middle" font-size="10" letter-spacing="3" fill="#4a3320">OSTSEE</text>
    <text x="0" y="305" text-anchor="middle" font-size="14" fill="#7a746b">5 · Graviert auf Holz</text>
  </g>
</svg>
